<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📋 BOM 对比工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --panel-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --border: #e5e5ea;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --row-alt: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0c;
      --panel-bg: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --accent: #0a84ff;
      --row-alt: #18181a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 10px 14px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; font-weight: 700; margin-right: auto; }
  .btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    transition: 0.15s;
    white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.green:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  input[type="file"] { display: none; }

  .upload-bar {
    padding: 8px 14px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .upload-slot {
    flex: 1;
    padding: 10px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    transition: 0.15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-slot:hover { border-color: var(--accent); color: var(--accent); }
  .upload-slot.loaded { border-color: var(--green); color: var(--green); border-style: solid; }
  .upload-slot .filename { font-weight: 700; display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; }

  .parse-info {
    font-size: 11px;
    color: var(--muted);
    padding: 0 14px 4px;
    line-height: 1.5;
  }

  .stats {
    font-size: 11px;
    color: var(--muted);
    padding: 4px 14px 6px;
    display: none;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stats.show { display: flex; }
  .stats .green { color: var(--green); font-weight: 700; }
  .stats .red { color: var(--red); font-weight: 700; }

  .table-wrap {
    flex: 1;
    overflow: auto;
    margin: 0 8px 8px;
    background: var(--panel-bg);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--panel-bg);
    padding: 10px 8px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    border-bottom: 2px solid var(--border);
    z-index: 5;
    white-space: nowrap;
  }
  thead th.th-row { width: 5%; text-align: center; }
  thead th.th-a { width: 42%; }
  thead th.th-b { width: 42%; }
  thead th.th-status { width: 11%; text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: rgba(59,130,246,0.08); }

  tbody tr.row-same { background: rgba(34, 197, 94, 0.06); }
  tbody tr.row-same:nth-child(even) { background: rgba(34, 197, 94, 0.1); }
  tbody tr.row-diff { background: rgba(239, 68, 68, 0.06); }
  tbody tr.row-diff:nth-child(even) { background: rgba(239, 68, 68, 0.1); }

  tbody td {
    padding: 9px 8px;
    vertical-align: top;
    word-break: break-word;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .cell-row {
    text-align: center;
    font-weight: 700;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .cell-a, .cell-b {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text);
  }
  .cell-empty {
    color: var(--muted);
    font-style: italic;
    opacity: 0.6;
    font-family: inherit;
  }

  .status-text {
    font-weight: 700;
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
  }
  .status-text.same { color: var(--green); }
  .status-text.diff { color: var(--red); }

  .empty-state {
    padding: 80px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    table { font-size: 11px; }
    thead th { padding: 8px 4px; font-size: 10px; }
    tbody td { padding: 7px 4px; }
    .status-text { font-size: 11px; }
    h1 { font-size: 14px; }
    .btn { padding: 6px 10px; font-size: 12px; }
    .cell-a, .cell-b { font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 BOM 对比工具</h1>
  <button class="btn primary" id="compareBtn" disabled>开始对比</button>
  <button class="btn green" id="exportBtn" disabled>📊 导出报告</button>
  <button class="btn" id="clearBtn">清空</button>
</header>

<div class="upload-bar">
  <label class="upload-slot" id="slotA">
    <div>📄 表 1 (A)</div>
    <span class="filename" id="filenameA">点击选择 PDF</span>
    <input type="file" id="fileA" accept=".pdf">
  </label>
  <label class="upload-slot" id="slotB">
    <div>📄 表 2 (B)</div>
    <span class="filename" id="filenameB">点击选择 PDF</span>
    <input type="file" id="fileB" accept=".pdf">
  </label>
</div>

<div class="parse-info" id="parseInfo"></div>
<div class="stats" id="stats"></div>

<div class="table-wrap" id="tableWrap">
  <div class="empty-state">导入两个 PDF 后，点「开始对比」<br>即可逐行查看比对结果</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let bomA = null;
let bomB = null;
let lastRows = null;

const fileA = document.getElementById('fileA');
const fileB = document.getElementById('fileB');
const filenameA = document.getElementById('filenameA');
const filenameB = document.getElementById('filenameB');
const slotA = document.getElementById('slotA');
const slotB = document.getElementById('slotB');
const compareBtn = document.getElementById('compareBtn');
const exportBtn = document.getElementById('exportBtn');

/* =========================================================
   文件上传
   ========================================================= */
fileA.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  slotA.classList.remove('loaded');
  filenameA.innerHTML = '<span class="spinner"></span> 解析中...';
  try {
    const rows = await parsePDF(file);
    bomA = { filename: file.name, rows };
    slotA.classList.add('loaded');
    filenameA.textContent = `${file.name} (${rows.length} 行)`;
    checkReady();
  } catch (err) {
    console.error(err);
    filenameA.textContent = '❌ 解析失败：' + err.message;
  }
});

fileB.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  slotB.classList.remove('loaded');
  filenameB.innerHTML = '<span class="spinner"></span> 解析中...';
  try {
    const rows = await parsePDF(file);
    bomB = { filename: file.name, rows };
    slotB.classList.add('loaded');
    filenameB.textContent = `${file.name} (${rows.length} 行)`;
    checkReady();
  } catch (err) {
    console.error(err);
    filenameB.textContent = '❌ 解析失败：' + err.message;
  }
});

function checkReady() {
  compareBtn.disabled = !(bomA && bomB);
  const info = document.getElementById('parseInfo');
  const parts = [];
  if (bomA) parts.push(`表1: ${bomA.rows.length} 行`);
  if (bomB) parts.push(`表2: ${bomB.rows.length} 行`);
  info.textContent = parts.length ? '解析结果 — ' + parts.join(' | ') : '';
}

document.getElementById('clearBtn').addEventListener('click', () => {
  bomA = null; bomB = null;
  fileA.value = ''; fileB.value = '';
  slotA.classList.remove('loaded'); slotB.classList.remove('loaded');
  filenameA.textContent = '点击选择 PDF';
  filenameB.textContent = '点击选择 PDF';
  document.getElementById('tableWrap').innerHTML =
    '<div class="empty-state">导入两个 PDF 后，点「开始对比」<br>即可逐行查看比对结果</div>';
  document.getElementById('stats').classList.remove('show');
  document.getElementById('parseInfo').textContent = '';
  compareBtn.disabled = true;
  exportBtn.disabled = true;
  lastRows = null;
});

compareBtn.addEventListener('click', () => {
  if (!bomA || !bomB) return;
  compareAndRender();
});

exportBtn.addEventListener('click', () => {
  if (!lastRows) return;
  exportReport();
});

/* =========================================================
   PDF 解析：每行的所有文本从左到右拼成一整行
   ========================================================= */
async function parsePDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const rows = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    // 按 y 坐标聚合行
    const yMap = new Map();
    for (const it of content.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5]);
      let key = null;
      for (const k of yMap.keys()) {
        if (Math.abs(k - y) < 5) { key = k; break; }
      }
      if (key === null) key = y;
      if (!yMap.has(key)) yMap.set(key, []);
      yMap.get(key).push({
        x: it.transform[4],
        str: it.str
      });
    }

    const ys = Array.from(yMap.keys()).sort((a, b) => b - a);
    for (const y of ys) {
      const items = yMap.get(y).sort((a, b) => a.x - b.x);

      // 把这一行的所有文本按 x 从左到右拼接，中间用空格隔开
      const fullText = items.map(it => it.str).join(' ').replace(/\s+/g, ' ').trim();

      if (!fullText) continue;
      if (isHeaderRow(fullText)) continue;

      rows.push(fullText);
    }
  }

  return rows;
}

// 过滤掉纯表头行
function isHeaderRow(text) {
  const lower = text.toLowerCase();
  const headerKeywords = ['序号', '编号', '物料', '名称', '规格', '型号', '数量', '用量', '备注',
                          'no.', 'part number', 'part no.', 'name', 'description', 'qty', 'unit'];
  // 如果这一行几乎全是表头关键词，就跳过
  let hits = 0;
  for (const kw of headerKeywords) {
    if (lower.includes(kw)) hits++;
  }
  // 一行里命中 3 个以上表头词，认为是表头
  return hits >= 3;
}

/* =========================================================
   逐行严格对比（行号一一对应）
   ========================================================= */
function compareAndRender() {
  const rowsA = bomA.rows;
  const rowsB = bomB.rows;
  const maxLen = Math.max(rowsA.length, rowsB.length);

  const result = [];
  for (let i = 0; i < maxLen; i++) {
    const aText = rowsA[i] !== undefined ? rowsA[i] : null;
    const bText = rowsB[i] !== undefined ? rowsB[i] : null;

    let same = false;
    if (aText !== null && bText !== null) {
      // 完全相同就算 Same（忽略首尾空白）
      same = normalize(aText) === normalize(bText);
    }

    result.push({
      rowIndex: i + 1,
      aText,
      bText,
      same
    });
  }

  renderTable(result);
  exportBtn.disabled = false;
}

function normalize(s) {
  return String(s).replace(/\s+/g, ' ').trim();
}

/* =========================================================
   渲染表格
   ========================================================= */
function renderTable(rows) {
  lastRows = rows;

  const wrap = document.getElementById('tableWrap');

  const sameCount = rows.filter(r => r.same).length;
  const diffCount = rows.length - sameCount;

  const stats = document.getElementById('stats');
  stats.classList.add('show');
  stats.innerHTML = `
    <span>共 <span style="color:var(--text);font-weight:700">${rows.length}</span> 行</span>
    <span>✅ Same <span class="green">${sameCount}</span></span>
    <span>❌ Different <span class="red">${diffCount}</span></span>
  `;

  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty-state">没有可对比的数据</div>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th class="th-row">#</th>
          <th class="th-a">表 1 (A)</th>
          <th class="th-b">表 2 (B)</th>
          <th class="th-status">状态</th>
        </tr>
      </thead>
      <tbody>
  `;

  for (const r of rows) {
    const rowClass = r.same ? 'row-same' : 'row-diff';
    const aText = r.aText !== null ? esc(r.aText) : '';
    const bText = r.bText !== null ? esc(r.bText) : '';

    html += `<tr class="${rowClass}">`;
    html += `<td class="cell-row">${r.rowIndex}</td>`;
    html += `<td class="cell-a">${aText ? aText : '<span class="cell-empty">(无)</span>'}</td>`;
    html += `<td class="cell-b">${bText ? bText : '<span class="cell-empty">(无)</span>'}</td>`;

    if (r.same) {
      html += `<td class="cell-status"><span class="status-text same">Same</span></td>`;
    } else {
      html += `<td class="cell-status"><span class="status-text diff">Different</span></td>`;
    }
    html += `</tr>`;
  }

  html += `</tbody></table>`;
  wrap.innerHTML = html;
  wrap.scrollTop = 0;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   导出报告
   ========================================================= */
function exportReport() {
  if (!lastRows || !bomA || !bomB) return;

  const rows = lastRows;
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const sameCount = rows.filter(r => r.same).length;
  const diffCount = rows.length - sameCount;

  const clean = s => String(s || '').replace(/"/g, '""').replace(/\n/g, ' ');
  const q = s => `"${clean(s)}"`;

  let csv = '\uFEFF';

  csv += '【BOM 逐行对比报告】\n';
  csv += `生成时间,${q(timeStr)}\n`;
  csv += `表1,${q(bomA.filename)},共 ${bomA.rows.length} 行\n`;
  csv += `表2,${q(bomB.filename)},共 ${bomB.rows.length} 行\n`;
  csv += '\n';

  csv += '【概要统计】\n';
  csv += '类别,数量\n';
  csv += `Same,${sameCount}\n`;
  csv += `Different,${diffCount}\n`;
  csv += `对比总行数,${rows.length}\n`;
  csv += '\n\n';

  csv += '【逐行对比明细】\n';
  csv += '行号,状态,表1内容,表2内容\n';
  for (const r of rows) {
    csv += [
      r.rowIndex,
      r.same ? 'Same' : 'Different',
      q(r.aText || ''),
      q(r.bText || '')
    ].join(',') + '\n';
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  link.href = URL.createObjectURL(blob);
  link.download = `BOM对比报告_${ts}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
