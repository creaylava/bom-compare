<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📋 BOM 对比工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --panel-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --border: #e5e5ea;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0c;
      --panel-bg: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --accent: #0a84ff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 10px 14px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; font-weight: 700; margin-right: auto; }
  .btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    transition: 0.15s;
    white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.green:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  input[type="file"] { display: none; }

  .upload-bar {
    padding: 8px 14px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .upload-slot {
    flex: 1;
    padding: 10px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    transition: 0.15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-slot:hover { border-color: var(--accent); color: var(--accent); }
  .upload-slot.loaded { border-color: var(--green); color: var(--green); border-style: solid; }
  .upload-slot .filename { font-weight: 700; display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; }

  .compare-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    gap: 6px;
    padding: 0 6px 8px;
    min-height: 0;
  }
  .panel {
    flex: 1;
    min-width: 0;
    background: var(--panel-bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .panel-header {
    position: sticky;
    top: 0;
    padding: 8px 10px;
    background: var(--panel-bg);
    border-bottom: 2px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .panel-header span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel-header span:last-child { color: var(--muted); flex-shrink: 0; }

  .col-header {
    display: flex;
    padding: 6px 10px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    position: sticky;
    top: 37px;
    z-index: 4;
  }
  .col-header .col-num { flex: 0 0 42%; }
  .col-header .col-name { flex: 1; }

  .bom-row {
    min-height: 40px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    transition: background 0.15s;
  }
  .bom-row .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    flex: 0 0 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 6px;
    border-right: 1px dashed var(--border);
  }
  .bom-row .name {
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-left: 4px;
  }
  .bom-row.matched { background: rgba(34, 197, 94, 0.1); }
  .bom-row.different { background: rgba(239, 68, 68, 0.12); }
  .bom-row.only { background: rgba(239, 68, 68, 0.2); }
  .bom-row.only .num::after {
    content: " ⚠";
    font-size: 10px;
    color: var(--red);
  }

  #svgLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  .legend {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    display: none;
    gap: 14px;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
  }
  .legend.show { display: flex; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-line { width: 22px; height: 3px; border-radius: 2px; }

  .empty-state {
    padding: 60px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 2;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats {
    font-size: 11px;
    color: var(--muted);
    padding: 4px 14px 0;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stats .green { color: var(--green); font-weight: 700; }
  .stats .red { color: var(--red); font-weight: 700; }

  .parse-info {
    font-size: 11px;
    color: var(--muted);
    padding: 0 14px 4px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>📋 BOM 对比工具</h1>
  <button class="btn primary" id="compareBtn" disabled>开始对比</button>
  <button class="btn green" id="exportBtn" disabled>📊 导出报告</button>
  <button class="btn" id="clearBtn">清空</button>
</header>

<div class="upload-bar">
  <label class="upload-slot" id="slotA">
    <div>📄 BOM 版本 A</div>
    <span class="filename" id="filenameA">点击选择 PDF</span>
    <input type="file" id="fileA" accept=".pdf">
  </label>
  <label class="upload-slot" id="slotB">
    <div>📄 BOM 版本 B</div>
    <span class="filename" id="filenameB">点击选择 PDF</span>
    <input type="file" id="fileB" accept=".pdf">
  </label>
</div>

<div class="parse-info" id="parseInfo"></div>
<div class="stats" id="stats" style="display:none;"></div>

<div class="compare-wrap" id="compareWrap">
  <div class="panel" id="panelA">
    <div class="empty-state">等待导入 BOM A</div>
  </div>
  <div class="panel" id="panelB">
    <div class="empty-state">等待导入 BOM B</div>
  </div>
  <svg id="svgLayer"></svg>
</div>

<div class="legend" id="legend">
  <div class="legend-item"><div class="legend-line" style="background:var(--green)"></div>编号+名称一致</div>
  <div class="legend-item"><div class="legend-line" style="background:var(--red)"></div>不一致</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let bomA = null;
let bomB = null;
let lastPairs = null;

const fileA = document.getElementById('fileA');
const fileB = document.getElementById('fileB');
const filenameA = document.getElementById('filenameA');
const filenameB = document.getElementById('filenameB');
const slotA = document.getElementById('slotA');
const slotB = document.getElementById('slotB');
const compareBtn = document.getElementById('compareBtn');
const exportBtn = document.getElementById('exportBtn');

/* =========================================================
   文件上传
   ========================================================= */
fileA.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  slotA.classList.remove('loaded');
  filenameA.innerHTML = '<span class="spinner"></span> 解析中...';
  try {
    const items = await parsePDF(file);
    bomA = { filename: file.name, items };
    slotA.classList.add('loaded');
    filenameA.textContent = `${file.name} (${items.length} 项)`;
    checkReady();
  } catch (err) {
    console.error(err);
    filenameA.textContent = '❌ 解析失败：' + err.message;
  }
});

fileB.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  slotB.classList.remove('loaded');
  filenameB.innerHTML = '<span class="spinner"></span> 解析中...';
  try {
    const items = await parsePDF(file);
    bomB = { filename: file.name, items };
    slotB.classList.add('loaded');
    filenameB.textContent = `${file.name} (${items.length} 项)`;
    checkReady();
  } catch (err) {
    console.error(err);
    filenameB.textContent = '❌ 解析失败：' + err.message;
  }
});

function checkReady() {
  compareBtn.disabled = !(bomA && bomB);
  const info = document.getElementById('parseInfo');
  const parts = [];
  if (bomA) parts.push(`A: ${bomA.items.length} 行`);
  if (bomB) parts.push(`B: ${bomB.items.length} 行`);
  info.textContent = parts.length ? '解析结果 — ' + parts.join(' | ') : '';
}

document.getElementById('clearBtn').addEventListener('click', () => {
  bomA = null; bomB = null;
  fileA.value = ''; fileB.value = '';
  slotA.classList.remove('loaded'); slotB.classList.remove('loaded');
  filenameA.textContent = '点击选择 PDF';
  filenameB.textContent = '点击选择 PDF';
  document.getElementById('panelA').innerHTML = '<div class="empty-state">等待导入 BOM A</div>';
  document.getElementById('panelB').innerHTML = '<div class="empty-state">等待导入 BOM B</div>';
  document.getElementById('svgLayer').innerHTML = '';
  document.getElementById('legend').classList.remove('show');
  document.getElementById('stats').style.display = 'none';
  document.getElementById('parseInfo').textContent = '';
  compareBtn.disabled = true;
  exportBtn.disabled = true;
  lastPairs = null;
});

compareBtn.addEventListener('click', () => {
  if (!bomA || !bomB) return;
  compareAndRender();
});

exportBtn.addEventListener('click', () => {
  if (!lastPairs) return;
  exportReport();
});

/* =========================================================
   PDF 解析
   ========================================================= */
async function parsePDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const rows = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    const yMap = new Map();
    for (const it of content.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5]);
      let key = null;
      for (const k of yMap.keys()) {
        if (Math.abs(k - y) < 5) { key = k; break; }
      }
      if (key === null) key = y;
      if (!yMap.has(key)) yMap.set(key, []);
      yMap.get(key).push({
        x: it.transform[4],
        right: it.transform[4] + (it.width || 0),
        str: it.str
      });
    }

    const ys = Array.from(yMap.keys()).sort((a, b) => b - a);
    for (const y of ys) {
      const items = yMap.get(y).sort((a, b) => a.x - b.x);

      const cells = [];
      let currentStr = '';
      let lastRight = null;
      for (const item of items) {
        if (lastRight !== null && item.x - lastRight > 15) {
          if (currentStr.trim()) cells.push(currentStr.trim());
          currentStr = item.str;
        } else {
          currentStr += (currentStr ? ' ' : '') + item.str;
        }
        lastRight = item.right;
      }
      if (currentStr.trim()) cells.push(currentStr.trim());

      if (cells.length === 0) continue;

      let startIdx = 0;
      if (/^\d{1,3}$/.test(cells[0])) startIdx = 1;

      const number = cells[startIdx] || '';
      const name = cells[startIdx + 1] || '';
      const raw = cells.join(' | ');

      if (isHeader(number, name)) continue;
      if (!number && !name) continue;

      rows.push({ number, name, raw });
    }
  }

  return rows;
}

function isHeader(number, name) {
  const lower = (number + ' ' + name).toLowerCase();
  const headerKeywords = ['序号', '编号', '物料', '名称', '规格', '型号', '数量', '用量',
                          'no', 'part number', 'part no', 'name', 'description', 'qty'];
  if (/^(序号|编号|物料|名称|规格|型号|数量|用量|no\.?|part|name|description|qty|unit)$/i.test(number)) return true;
  if (/^(名称|规格|型号|数量|用量|description|qty|unit)$/i.test(name)) return true;
  let count = 0;
  for (const kw of headerKeywords) {
    if (lower.includes(kw)) count++;
  }
  return count >= 2;
}

/* =========================================================
   对比
   ========================================================= */
function compareAndRender() {
  const itemsA = bomA.items;
  const itemsB = bomB.items;

  const usedB = new Set();
  const pairs = [];

  for (let i = 0; i < itemsA.length; i++) {
    const a = itemsA[i];
    let matchedBIdx = -1;

    for (let j = 0; j < itemsB.length; j++) {
      if (usedB.has(j)) continue;
      if (itemsB[j].number === a.number && itemsB[j].name === a.name) {
        matchedBIdx = j; break;
      }
    }
    if (matchedBIdx === -1) {
      for (let j = 0; j < itemsB.length; j++) {
        if (usedB.has(j)) continue;
        if (itemsB[j].number === a.number) {
          matchedBIdx = j; break;
        }
      }
    }

    if (matchedBIdx !== -1) {
      usedB.add(matchedBIdx);
      const b = itemsB[matchedBIdx];
      const sameNumber = a.number === b.number;
      const sameName = a.name === b.name;
      pairs.push({
        a, b, aIdx: i, bIdx: matchedBIdx,
        same: sameNumber && sameName,
        reason: !sameNumber ? '编号不同' : (!sameName ? '名称不同' : '一致')
      });
    } else {
      pairs.push({ a, b: null, aIdx: i, bIdx: -1, same: false, reason: 'A独有' });
    }
  }

  for (let j = 0; j < itemsB.length; j++) {
    if (!usedB.has(j)) {
      pairs.push({ a: null, b: itemsB[j], aIdx: -1, bIdx: j, same: false, reason: 'B独有' });
    }
  }

  render(pairs);
  exportBtn.disabled = false;
}

/* =========================================================
   渲染
   ========================================================= */
function render(pairs) {
  lastPairs = pairs;

  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');
  const svg = document.getElementById('svgLayer');
  svg.innerHTML = '';

  const aStatus = new Array(bomA.items.length).fill('only');
  for (const p of pairs) {
    if (p.a) aStatus[p.aIdx] = p.same ? 'matched' : 'different';
  }

  let htmlA = `<div class="panel-header"><span>A: ${esc(bomA.filename)}</span><span>${bomA.items.length} 行</span></div>
    <div class="col-header"><span class="col-num">编号 (Number)</span><span class="col-name">名称 (Name)</span></div>`;
  for (let i = 0; i < bomA.items.length; i++) {
    const item = bomA.items[i];
    htmlA += `<div class="bom-row ${aStatus[i]}" data-side="a" data-index="${i}">
      <span class="num">${esc(item.number || '(空)')}</span>
      <span class="name">${esc(item.name || '')}</span>
    </div>`;
  }
  panelA.innerHTML = htmlA;

  const bStatus = new Array(bomB.items.length).fill('only');
  for (const p of pairs) {
    if (p.b) bStatus[p.bIdx] = p.same ? 'matched' : 'different';
  }

  let htmlB = `<div class="panel-header"><span>B: ${esc(bomB.filename)}</span><span>${bomB.items.length} 行</span></div>
    <div class="col-header"><span class="col-num">编号 (Number)</span><span class="col-name">名称 (Name)</span></div>`;
  for (let i = 0; i < bomB.items.length; i++) {
    const item = bomB.items[i];
    htmlB += `<div class="bom-row ${bStatus[i]}" data-side="b" data-index="${i}">
      <span class="num">${esc(item.number || '(空)')}</span>
      <span class="name">${esc(item.name || '')}</span>
    </div>`;
  }
  panelB.innerHTML = htmlB;

  const sameCount = pairs.filter(p => p.same).length;
  const nameDiffCount = pairs.filter(p => p.a && p.b && !p.same && p.reason === '名称不同').length;
  const numDiffCount = pairs.filter(p => p.a && p.b && !p.same && p.reason === '编号不同').length;
  const onlyACount = pairs.filter(p => p.a && !p.b).length;
  const onlyBCount = pairs.filter(p => !p.a && p.b).length;

  const stats = document.getElementById('stats');
  stats.style.display = 'flex';
  stats.innerHTML = `
    <span>✅ 完全一致 <span class="green">${sameCount}</span></span>
    <span>❌ 名称不同 <span class="red">${nameDiffCount}</span></span>
    <span>⚠ 编号不同 <span class="red">${numDiffCount}</span></span>
    <span>⚠ A 独有 <span class="red">${onlyACount}</span></span>
    <span>⚠ B 独有 <span class="red">${onlyBCount}</span></span>
  `;

  setupScrollSync();
  requestAnimationFrame(() => drawLines(pairs));
  document.getElementById('legend').classList.add('show');
}

let scrollSyncLock = false;
function setupScrollSync() {
  const pa = document.getElementById('panelA');
  const pb = document.getElementById('panelB');
  pa.onscroll = () => {
    if (scrollSyncLock) return;
    scrollSyncLock = true;
    pb.scrollTop = pa.scrollTop;
    requestAnimationFrame(() => { scrollSyncLock = false; });
    scheduleDraw();
  };
  pb.onscroll = () => {
    if (scrollSyncLock) return;
    scrollSyncLock = true;
    pa.scrollTop = pb.scrollTop;
    requestAnimationFrame(() => { scrollSyncLock = false; });
    scheduleDraw();
  };
}

let drawRAF = null;
function scheduleDraw() {
  if (drawRAF) return;
  drawRAF = requestAnimationFrame(() => {
    drawRAF = null;
    if (lastPairs) drawLines(lastPairs);
  });
}

function drawLines(pairs) {
  const svg = document.getElementById('svgLayer');
  const wrap = document.getElementById('compareWrap');
  const wrapRect = wrap.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
  svg.style.width = wrapRect.width + 'px';
  svg.style.height = wrapRect.height + 'px';
  svg.innerHTML = '';

  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');

  for (const p of pairs) {
    if (!p.a || !p.b) continue;
    const elA = panelA.querySelector(`[data-index="${p.aIdx}"]`);
    const elB = panelB.querySelector(`[data-index="${p.bIdx}"]`);
    if (!elA || !elB) continue;

    const rA = elA.getBoundingClientRect();
    const rB = elB.getBoundingClientRect();

    if (rA.bottom < wrapRect.top || rA.top > wrapRect.bottom) continue;
    if (rB.bottom < wrapRect.top || rB.top > wrapRect.bottom) continue;

    const x1 = rA.right - wrapRect.left;
    const y1 = rA.top + rA.height / 2 - wrapRect.top;
    const x2 = rB.left - wrapRect.left;
    const y2 = rB.top + rB.height / 2 - wrapRect.top;

    const midX = (x1 + x2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
    path.setAttribute('stroke', p.same ? '#22c55e' : '#ef4444');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('opacity', '0.8');
    svg.appendChild(path);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   导出报告（CSV）
   ========================================================= */
function exportReport() {
  if (!lastPairs || !bomA || !bomB) return;

  const pairs = lastPairs;
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const sameList = pairs.filter(p => p.same);
  const nameDiffList = pairs.filter(p => p.a && p.b && !p.same && p.reason === '名称不同');
  const numDiffList = pairs.filter(p => p.a && p.b && !p.same && p.reason === '编号不同');
  const onlyAList = pairs.filter(p => p.a && !p.b);
  const onlyBList = pairs.filter(p => !p.a && p.b);
  const diffTotal = nameDiffList.length + numDiffList.length + onlyAList.length + onlyBList.length;

  const clean = s => String(s || '').replace(/"/g, '""').replace(/\n/g, ' ');
  const q = s => `"${clean(s)}"`;

  let csv = '\uFEFF';

  // ============ 概要 ============
  csv += '【BOM 对比报告】\n';
  csv += `生成时间,${q(timeStr)}\n`;
  csv += `版本 A,${q(bomA.filename)},共 ${bomA.items.length} 行\n`;
  csv += `版本 B,${q(bomB.filename)},共 ${bomB.items.length} 行\n`;
  csv += '\n';

  csv += '【概要统计】\n';
  csv += '类别,数量\n';
  csv += `✅ 完全一致（编号+名称都相同）,${sameList.length}\n`;
  csv += `❌ 名称不同（编号相同，名称不同）,${nameDiffList.length}\n`;
  csv += `⚠ 编号不同（编号本身不同）,${numDiffList.length}\n`;
  csv += `⚠ A 独有（B 中不存在）,${onlyAList.length}\n`;
  csv += `⚠ B 独有（A 中不存在）,${onlyBList.length}\n`;
  csv += `差异合计,${diffTotal}\n`;
  csv += '\n\n';

  // ============ 不同点明细 ============
  csv += '【不同点明细】\n';
  csv += '序号,差异类型,A-编号,A-名称,B-编号,B-名称\n';
  let idx = 1;

  // 名称不同
  for (const p of nameDiffList) {
    csv += [
      idx++,
      '名称不同',
      q(p.a.number),
      q(p.a.name),
      q(p.b.number),
      q(p.b.name)
    ].join(',') + '\n';
  }
  // 编号不同
  for (const p of numDiffList) {
    csv += [
      idx++,
      '编号不同',
      q(p.a.number),
      q(p.a.name),
      q(p.b.number),
      q(p.b.name)
    ].join(',') + '\n';
  }
  // A 独有
  for (const p of onlyAList) {
    csv += [
      idx++,
      'A独有',
      q(p.a.number),
      q(p.a.name),
      '(无)',
      '(无)'
    ].join(',') + '\n';
  }
  // B 独有
  for (const p of onlyBList) {
    csv += [
      idx++,
      'B独有',
      '(无)',
      '(无)',
      q(p.b.number),
      q(p.b.name)
    ].join(',') + '\n';
  }

  if (diffTotal === 0) {
    csv += '（无差异）\n';
  }
  csv += '\n\n';

  // ============ 相同点明细 ============
  csv += '【相同点明细】\n';
  csv += '序号,编号,名称\n';
  let idx2 = 1;
  for (const p of sameList) {
    csv += [
      idx2++,
      q(p.a.number),
      q(p.a.name)
    ].join(',') + '\n';
  }
  if (sameList.length === 0) {
    csv += '（无完全一致的条目）\n';
  }

  // ============ 下载 ============
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  link.href = URL.createObjectURL(blob);
  link.download = `BOM对比报告_${ts}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}

window.addEventListener('resize', () => {
  if (lastPairs) {
    requestAnimationFrame(() => drawLines(lastPairs));
  }
});
</script>
</body>
</html>
