<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📋 BOM 对比工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --panel-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --border: #e5e5ea;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --row-alt: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0c;
      --panel-bg: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --accent: #0a84ff;
      --row-alt: #18181a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 10px 14px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; font-weight: 700; margin-right: auto; }
  .btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    transition: 0.15s;
    white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.green:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  input[type="file"] { display: none; }

  .upload-bar {
    padding: 8px 14px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .upload-slot {
    flex: 1;
    padding: 10px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    transition: 0.15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-slot:hover { border-color: var(--accent); color: var(--accent); }
  .upload-slot.loaded { border-color: var(--green); color: var(--green); border-style: solid; }
  .upload-slot .filename { font-weight: 700; display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; }

  .parse-info {
    font-size: 11px;
    color: var(--muted);
    padding: 0 14px 4px;
    line-height: 1.5;
  }

  .stats {
    font-size: 11px;
    color: var(--muted);
    padding: 4px 14px 6px;
    display: none;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stats.show { display: flex; }
  .stats .green { color: var(--green); font-weight: 700; }
  .stats .red { color: var(--red); font-weight: 700; }

  /* 对比表 */
  .table-wrap {
    flex: 1;
    overflow: auto;
    margin: 0 8px 8px;
    background: var(--panel-bg);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--panel-bg);
    padding: 10px 8px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    border-bottom: 2px solid var(--border);
    z-index: 5;
    white-space: nowrap;
  }
  /* 列宽 */
  thead th.th-a-num, .cell-a-num { width: 18%; }
  thead th.th-a-name, .cell-a-name { width: 27%; }
  thead th.th-b-num, .cell-b-num { width: 18%; }
  thead th.th-b-name, .cell-b-name { width: 27%; }
  thead th.th-status, .cell-status { width: 10%; text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: rgba(59,130,246,0.06); }

  /* 状态行背景色 */
  tbody tr.row-same { background: rgba(34, 197, 94, 0.06); }
  tbody tr.row-same:nth-child(even) { background: rgba(34, 197, 94, 0.1); }
  tbody tr.row-diff { background: rgba(239, 68, 68, 0.06); }
  tbody tr.row-diff:nth-child(even) { background: rgba(239, 68, 68, 0.1); }
  tbody tr.row-only { background: rgba(239, 68, 68, 0.14); }

  tbody td {
    padding: 9px 8px;
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cell-a-num, .cell-b-num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
  }
  .cell-a-name, .cell-b-name {
    color: var(--text);
  }
  .cell-empty {
    color: var(--muted);
    font-style: italic;
    opacity: 0.6;
  }

  .status-text {
    font-weight: 700;
    font-size: 12px;
    text-align: center;
  }
  .status-text.same { color: var(--green); }
  .status-text.diff { color: var(--red); }

  .empty-state {
    padding: 80px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 移动端适配 */
  @media (max-width: 640px) {
    table { font-size: 11px; }
    thead th { padding: 8px 4px; font-size: 10px; }
    tbody td { padding: 7px 4px; }
    .status-text { font-size: 11px; }
    h1 { font-size: 14px; }
    .btn { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 BOM 对比工具</h1>
  <button class="btn primary" id="compareBtn" disabled>开始对比</button>
  <button class="btn green" id="exportBtn" disabled>📊 导出报告</button>
  <button class="btn" id="clearBtn">清空</button>
</header>

<div class="upload-bar">
  <label class="upload-slot" id="slotA">
    <div>📄 BOM 版本 A</div>
    <span class="filename" id="filenameA">点击选择 PDF</span>
    <input type="file" id="fileA" accept=".pdf">
  </label>
  <label class="upload-slot" id="slotB">
    <div>📄 BOM 版本 B</div>
    <span class="filename" id="filenameB">点击选择 PDF</span>
    <input type="file" id="fileB" accept=".pdf">
  </label>
</div>

<div class="parse-info" id="parseInfo"></div>
<div class="stats" id="stats"></div>

<div class="table-wrap" id="tableWrap">
  <div class="empty-state">导入两个 PDF 后，点「开始对比」<br>即可逐行查看比对结果</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let bomA = null;
let bomB = null;
let lastPairs = null;

const fileA = document.getElementById('fileA');
const fileB = document.getElementById('fileB');
const filenameA = document.getElementById('filenameA');
const filenameB = document.getElementById('filenameB');
const slotA = document.getElementById('slotA');
const slotB = document.getElementById('slotB');
const compareBtn = document.getElementById('compareBtn');
const exportBtn = document.getElementById('exportBtn');

/* =========================================================
   文件上传
   ========================================================= */
fileA.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  slotA.classList.remove('loaded');
  filenameA.innerHTML = '<span class="spinner"></span> 解析中...';
  try {
    const items = await parsePDF(file);
    bomA = { filename: file.name, items };
    slotA.classList.add('loaded');
    filenameA.textContent = `${file.name} (${items.length} 行)`;
    checkReady();
  } catch (err) {
    console.error(err);
    filenameA.textContent = '❌ 解析失败：' + err.message;
  }
});

fileB.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  slotB.classList.remove('loaded');
  filenameB.innerHTML = '<span class="spinner"></span> 解析中...';
  try {
    const items = await parsePDF(file);
    bomB = { filename: file.name, items };
    slotB.classList.add('loaded');
    filenameB.textContent = `${file.name} (${items.length} 行)`;
    checkReady();
  } catch (err) {
    console.error(err);
    filenameB.textContent = '❌ 解析失败：' + err.message;
  }
});

function checkReady() {
  compareBtn.disabled = !(bomA && bomB);
  const info = document.getElementById('parseInfo');
  const parts = [];
  if (bomA) parts.push(`A: ${bomA.items.length} 行`);
  if (bomB) parts.push(`B: ${bomB.items.length} 行`);
  info.textContent = parts.length ? '解析结果 — ' + parts.join(' | ') : '';
}

document.getElementById('clearBtn').addEventListener('click', () => {
  bomA = null; bomB = null;
  fileA.value = ''; fileB.value = '';
  slotA.classList.remove('loaded'); slotB.classList.remove('loaded');
  filenameA.textContent = '点击选择 PDF';
  filenameB.textContent = '点击选择 PDF';
  document.getElementById('tableWrap').innerHTML =
    '<div class="empty-state">导入两个 PDF 后，点「开始对比」<br>即可逐行查看比对结果</div>';
  document.getElementById('stats').classList.remove('show');
  document.getElementById('parseInfo').textContent = '';
  compareBtn.disabled = true;
  exportBtn.disabled = true;
  lastPairs = null;
});

compareBtn.addEventListener('click', () => {
  if (!bomA || !bomB) return;
  compareAndRender();
});

exportBtn.addEventListener('click', () => {
  if (!lastPairs) return;
  exportReport();
});

/* =========================================================
   PDF 解析
   ========================================================= */
async function parsePDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const rows = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    const yMap = new Map();
    for (const it of content.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5]);
      let key = null;
      for (const k of yMap.keys()) {
        if (Math.abs(k - y) < 5) { key = k; break; }
      }
      if (key === null) key = y;
      if (!yMap.has(key)) yMap.set(key, []);
      yMap.get(key).push({
        x: it.transform[4],
        right: it.transform[4] + (it.width || 0),
        str: it.str
      });
    }

    const ys = Array.from(yMap.keys()).sort((a, b) => b - a);
    for (const y of ys) {
      const items = yMap.get(y).sort((a, b) => a.x - b.x);

      const cells = [];
      let currentStr = '';
      let lastRight = null;
      for (const item of items) {
        if (lastRight !== null && item.x - lastRight > 15) {
          if (currentStr.trim()) cells.push(currentStr.trim());
          currentStr = item.str;
        } else {
          currentStr += (currentStr ? ' ' : '') + item.str;
        }
        lastRight = item.right;
      }
      if (currentStr.trim()) cells.push(currentStr.trim());

      if (cells.length === 0) continue;

      let startIdx = 0;
      if (/^\d{1,3}$/.test(cells[0])) startIdx = 1;

      const number = cells[startIdx] || '';
      const name = cells[startIdx + 1] || '';

      if (isHeader(number, name)) continue;
      if (!number && !name) continue;

      rows.push({ number, name });
    }
  }

  return rows;
}

function isHeader(number, name) {
  const lower = (number + ' ' + name).toLowerCase();
  const headerKeywords = ['序号', '编号', '物料', '名称', '规格', '型号', '数量', '用量',
                          'no', 'part number', 'part no', 'name', 'description', 'qty'];
  if (/^(序号|编号|物料|名称|规格|型号|数量|用量|no\.?|part|name|description|qty|unit)$/i.test(number)) return true;
  if (/^(名称|规格|型号|数量|用量|description|qty|unit)$/i.test(name)) return true;
  let count = 0;
  for (const kw of headerKeywords) {
    if (lower.includes(kw)) count++;
  }
  return count >= 2;
}

/* =========================================================
   对比（逐行对齐）
   ========================================================= */
function compareAndRender() {
  const itemsA = bomA.items;
  const itemsB = bomB.items;

  const usedB = new Set();
  const pairs = [];

  for (let i = 0; i < itemsA.length; i++) {
    const a = itemsA[i];
    let matchedBIdx = -1;

    // 优先：编号 + 名称 都相同
    for (let j = 0; j < itemsB.length; j++) {
      if (usedB.has(j)) continue;
      if (itemsB[j].number === a.number && itemsB[j].name === a.name) {
        matchedBIdx = j; break;
      }
    }
    // 其次：编号相同即可
    if (matchedBIdx === -1) {
      for (let j = 0; j < itemsB.length; j++) {
        if (usedB.has(j)) continue;
        if (itemsB[j].number === a.number) {
          matchedBIdx = j; break;
        }
      }
    }

    if (matchedBIdx !== -1) {
      usedB.add(matchedBIdx);
      const b = itemsB[matchedBIdx];
      const sameNumber = a.number === b.number;
      const sameName = a.name === b.name;
      pairs.push({
        a, b,
        same: sameNumber && sameName,
        reason: !sameNumber ? '编号不同' : (!sameName ? '名称不同' : '一致')
      });
    } else {
      pairs.push({ a, b: null, same: false, reason: 'A独有' });
    }
  }

  // B 中未匹配的行
  for (let j = 0; j < itemsB.length; j++) {
    if (!usedB.has(j)) {
      pairs.push({ a: null, b: itemsB[j], same: false, reason: 'B独有' });
    }
  }

  renderTable(pairs);
  exportBtn.disabled = false;
}

/* =========================================================
   渲染表格
   ========================================================= */
function renderTable(pairs) {
  lastPairs = pairs;

  const wrap = document.getElementById('tableWrap');

  // 统计
  const sameCount = pairs.filter(p => p.same).length;
  const diffCount = pairs.length - sameCount;

  const stats = document.getElementById('stats');
  stats.classList.add('show');
  stats.innerHTML = `
    <span>共 <span style="color:var(--text);font-weight:700">${pairs.length}</span> 行</span>
    <span>✅ Same <span class="green">${sameCount}</span></span>
    <span>❌ Different <span class="red">${diffCount}</span></span>
  `;

  if (pairs.length === 0) {
    wrap.innerHTML = '<div class="empty-state">没有可对比的数据</div>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th class="th-a-num">A-编号</th>
          <th class="th-a-name">A-名称</th>
          <th class="th-b-num">B-编号</th>
          <th class="th-b-name">B-名称</th>
          <th class="th-status">状态</th>
        </tr>
      </thead>
      <tbody>
  `;

  for (const p of pairs) {
    const rowClass = p.same ? 'row-same' : (p.a && p.b ? 'row-diff' : 'row-only');
    const aNum = p.a ? esc(p.a.number) : '';
    const aName = p.a ? esc(p.a.name) : '';
    const bNum = p.b ? esc(p.b.number) : '';
    const bName = p.b ? esc(p.b.name) : '';

    html += `<tr class="${rowClass}">`;
    html += `<td class="cell-a-num">${aNum ? aNum : '<span class="cell-empty">(无)</span>'}</td>`;
    html += `<td class="cell-a-name">${aName ? aName : '<span class="cell-empty">(无)</span>'}</td>`;
    html += `<td class="cell-b-num">${bNum ? bNum : '<span class="cell-empty">(无)</span>'}</td>`;
    html += `<td class="cell-b-name">${bName ? bName : '<span class="cell-empty">(无)</span>'}</td>`;

    if (p.same) {
      html += `<td class="cell-status"><span class="status-text same">Same</span></td>`;
    } else {
      html += `<td class="cell-status"><span class="status-text diff">Different</span></td>`;
    }
    html += `</tr>`;
  }

  html += `</tbody></table>`;
  wrap.innerHTML = html;
  wrap.scrollTop = 0;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   导出报告
   ========================================================= */
function exportReport() {
  if (!lastPairs || !bomA || !bomB) return;

  const pairs = lastPairs;
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const sameList = pairs.filter(p => p.same);
  const diffList = pairs.filter(p => !p.same);

  const clean = s => String(s || '').replace(/"/g, '""').replace(/\n/g, ' ');
  const q = s => `"${clean(s)}"`;

  let csv = '\uFEFF';

  // ============ 概要 ============
  csv += '【BOM 对比报告】\n';
  csv += `生成时间,${q(timeStr)}\n`;
  csv += `版本 A,${q(bomA.filename)},共 ${bomA.items.length} 行\n`;
  csv += `版本 B,${q(bomB.filename)},共 ${bomB.items.length} 行\n`;
  csv += '\n';

  csv += '【概要统计】\n';
  csv += '类别,数量\n';
  csv += `Same（编号+名称都相同）,${sameList.length}\n`;
  csv += `Different（有差异）,${diffList.length}\n`;
  csv += `对比总行数,${pairs.length}\n`;
  csv += '\n\n';

  // ============ 逐行明细 ============
  csv += '【逐行对比明细】\n';
  csv += '序号,状态,差异类型,A-编号,A-名称,B-编号,B-名称\n';
  let idx = 1;
  for (const p of pairs) {
    csv += [
      idx++,
      p.same ? 'Same' : 'Different',
      q(p.reason || ''),
      q(p.a ? p.a.number : ''),
      q(p.a ? p.a.name : ''),
      q(p.b ? p.b.number : ''),
      q(p.b ? p.b.name : '')
    ].join(',') + '\n';
  }

  // ============ 下载 ============
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  link.href = URL.createObjectURL(blob);
  link.download = `BOM对比报告_${ts}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
